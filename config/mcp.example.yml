# Example only: not loaded automatically. Review authentication before use.
# DSH uses Cordis rows, not the mcpServers JSON format from other hosts.
- id: mcp-github
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: github
    transport: streamable-http
    url: https://api.githubcopilot.com/mcp/
    headers:
      Authorization: !!js '`Bearer ${process.env.GITHUB_MCP_TOKEN}`'

